name: Deploy GWP to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Permite disparo manual desde la interfaz de GitHub

# Evitar despliegues solapados si haces muchos push seguidos
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Versión fija de Ubuntu para estabilidad
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Build
        run: |
          cd web_js
          # 1. Asegurar que la nueva vista estratégica sea el punto de entrada oficial
          # Copiamos index_vistas2.html a index.html (sobreescribiendo el viejo)
          cp index_vistas2.html index.html
          
          # 2. Crear .nojekyll para evitar que GitHub ignore carpetas con dots/underscores
          touch .nojekyll

      - name: Cache Busting (Update Versions)
        run: |
          cd web_js
          # Usamos un hash de 12 caracteres de la commit SHA
          VERSION_SHORT=$(echo "${{ github.sha }}" | cut -c1-12)
          echo "Actualizando assets a la versión: $VERSION_SHORT"
          
          # Reemplazo recursivo en todos los archivos HTML dentro de web_js
          find . -name "*.html" -type f -exec sed -i "s/\?v=[a-zA-Z0-9.]*/?v=$VERSION_SHORT/g" {} +

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Desplegamos el contenido interno de 'web_js' directamente a la raíz de la web
          # Esto mantiene las rutas relativas (js/, css/, vistas2/) funcionando perfectamente.
          path: './web_js'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
