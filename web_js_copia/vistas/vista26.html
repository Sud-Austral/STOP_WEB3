<!-- Vista 26: Comparación Regional  -->

<!-- Section -->
<div class="card">
    <div class="mb-sm" style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
        <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill-cead">CARGANDO...</span>
        <span style="margin: 0 8px; color: #cbd5e1;">/</span>
        <span class="periodo-fill-cead">--</span>
    </div>

    <div class="section-header">
        <h2 class="section-title">¿Cómo nos comparamos regionalmente? </h2>
    </div>
    <p class="text-muted mb-md">Ranking comunal dentro de la región basado en el CEAD</p>

    <!-- Alert Box -->
    <div class="alert alert--info mb-lg" id="alertIA6Cead">
        <strong>🤖 Interpretación de IA:</strong> <span id="alertText6Cead">Comparando con otras comunas...</span>
    </div>

    <!-- Legend -->
    <div class="chart-legend mb-md">
        <div class="legend-item">
            <span class="legend-color" style="background: #3b82f6;"></span>
            Ranking Actual (Pos N°)
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-wrapper chart-wrapper--xl">
        <canvas id="chartRegionalCead"></canvas>
    </div>

    <p class="chart-footnote text-muted">
        * Ranking basado en la columna 'Ranking Comunal Regional' del CEAD.
    </p>
</div>

<style>
    .chart-legend {
        display: flex;
        justify-content: flex-end;
        gap: 1.5rem;
        padding: 0.5rem 0;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--color-text-muted);
    }

    .legend-color {
        width: 12px;
        height: 12px;
        border-radius: 2px;
    }

    .chart-footnote {
        font-size: 0.75rem;
        margin-top: 1rem;
        font-style: italic;
        text-align: center;
    }
</style>

<script>
    (async function initVista26() {
        const waitForDataCead = () => new Promise(r => {
            const c = () => (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) ? r() : setTimeout(c, 100); c();
        });
        await waitForDataCead();

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allData;
        if (!data || data.length === 0) return;

        const currentPeriodRow = data[0];
        const currentMonthNum = currentPeriodRow[COLS.MES_NUM];
        const currentYear = currentPeriodRow[COLS.ANIO];

        const currentMonthData = data.filter(row => row[COLS.MES_NUM] === currentMonthNum && row[COLS.ANIO] === currentYear);

        document.querySelectorAll('.comuna-fill-cead').forEach(el => el.textContent = STATE_DATA_CEAD.comunaName);
        document.querySelectorAll('.periodo-fill-cead').forEach(el => el.textContent = `${currentPeriodRow[COLS.MES]} ${currentPeriodRow[COLS.ANIO]}`);

        await new Promise(r => { if (typeof Chart !== 'undefined') r(); else setTimeout(() => new Promise(x => setTimeout(x, 100)).then(r), 100); });

        // Filter valid rankings
        let rankingData = currentMonthData
            .filter(r => r[COLS.RANKING_COMUNAL_REGIONAL] && r[COLS.RANKING_COMUNAL_REGIONAL] > 0)
            .sort((a, b) => (a[COLS.RANKING_COMUNAL_REGIONAL] || 999) - (b[COLS.RANKING_COMUNAL_REGIONAL] || 999))
            .slice(0, 10); // Show top 10 relevant rankings for this comuna's crimes?

        // Actually, this view in vista6 likely showed *Comparison with other comunas*.
        // But since we only have data for ONE comuna loaded in STATE_DATA_CEAD (filtered by codcom),
        // we can only show the RANKING NUMBER of THIS comuna for its various crime types.
        // We cannot show other communes unless we load them.
        // So we will show the Ranking of different crimes within the region for this specific comuna.

        if (rankingData.length === 0) {
            rankingData = [...currentMonthData].slice(0, 5); // Fallback
        }

        const labels = rankingData.map(r => {
            const name = r[COLS.DESCRIPCION] || 'Sin nombre';
            return name.length > 25 ? name.substring(0, 22) + '...' : name;
        });

        const rankings = rankingData.map(r => r[COLS.RANKING_COMUNAL_REGIONAL] || 0);

        // Calculate an inverse metric for visualization if "Ranking 1" is "Highest/Worst"
        // Ranking 1 usually means #1 in crime, which is taller bar? Or just show the number?
        // Let's show the number directly but maybe inverted visually or just bars.
        // Let's stick to simple bars for the ranking number.

        document.getElementById('alertText6Cead').innerHTML =
            `El gráfico muestra el <strong>Ranking Regional</strong> de la comuna en distintos delitos. ` +
            `Un ranking menor (ej. 1) indica mayor frecuencia comparativa en la región.`;

        new Chart(document.getElementById('chartRegionalCead'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Ranking Regional (Posición)',
                    data: rankings,
                    backgroundColor: '#3b82f6',
                    borderRadius: 4,
                    barThickness: 30
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y',
                plugins: { legend: { display: true, position: 'top' } },
                scales: {
                    x: {
                        title: { display: true, text: 'Posición Ranking (Menor es mayor incidencia)' },
                        beginAtZero: true,
                        reverse: true, // Rank 1 is "top" so maybe visually on right? Or left? sticking to standard 0->N
                        grid: { color: '#e2e8f0' }
                    },
                    y: { grid: { display: false } }
                }
            }
        });
    })();
</script>
