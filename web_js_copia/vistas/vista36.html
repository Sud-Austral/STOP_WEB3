<!-- Vista 36: Tasas y Demografía  -->
<div class="card">
    <div class="mb-sm" style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
        <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill-cead">CARGANDO...</span>
        <span style="margin: 0 8px; color: #cbd5e1;">/</span>
        <span class="periodo-fill-cead">--</span>
    </div>

    <div class="section-header">
        <h2 class="section-title">Análisis de Tasas x 100k Hab. </h2>
    </div>
    <p class="text-muted mb-lg">Normalización delictual basada en población comunal estimada</p>

    <!-- Demographics Info -->
    <div class="kpi-grid mb-xl">
        <div class="kpi-card">
            <div class="kpi-label">Población Comunal</div>
            <div class="kpi-value" id="v36_poblacion">--</div>
            <div class="kpi-sub">Habitantes (Estimado)</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Grupo Poblacional</div>
            <div class="kpi-value" id="v36_clase" style="font-size: 1.2rem;">--</div>
            <div class="kpi-sub">Clasificación</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Tasa Delictual Mensual</div>
            <div class="kpi-value" id="v36_tasa">--</div>
            <div class="kpi-sub">Casos x 100k hab.</div>
        </div>
    </div>

    <!-- Chart: Casos vs Tasa -->
    <h4 class="card-title">Top 5 Delitos por Tasa Ajustada</h4>
    <div class="chart-wrapper chart-wrapper--lg">
        <canvas id="chartTasaDelitoCead"></canvas>
    </div>
</div>

<script>
    (async function initVista36() {
        const waitForDataCead = () => new Promise(r => {
            const c = () => (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) ? r() : setTimeout(c, 100); c();
        });
        await waitForDataCead();
        await new Promise(r => { if (typeof Chart !== 'undefined') r(); else setTimeout(() => new Promise(x => setTimeout(x, 100)).then(r), 100); });

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allData;
        if (!data || data.length === 0) return;

        const currentPeriodRow = data[0];
        document.querySelectorAll('.comuna-fill-cead').forEach(el => el.textContent = STATE_DATA_CEAD.comunaName);
        document.querySelectorAll('.periodo-fill-cead').forEach(el => el.textContent = `${currentPeriodRow[COLS.MES]} ${currentPeriodRow[COLS.ANIO]}`);

        // Try to get population from STATE_DATA (Legacy) if available and matches commune
        let poblacion = 50000; // Default fallback
        let clasePob = 'Estimada';

        if (typeof STATE_DATA !== 'undefined' && STATE_DATA.codcom === STATE_DATA_CEAD.codcom && STATE_DATA.allData && STATE_DATA.allData.length > 0) {
            // Find population from legacy data
            const row = STATE_DATA.allData[0];
            if (row[window.COLS.POBLACION]) {
                poblacion = row[window.COLS.POBLACION];
                clasePob = row[window.COLS.CLASE_POBLACION] || 'Oficial';
            }
        }

        document.getElementById('v36_poblacion').textContent = new Intl.NumberFormat('es-CL').format(poblacion);
        document.getElementById('v36_clase').textContent = clasePob;

        // Current Month Stats
        const currentData = data.filter(r => r[COLS.MES_NUM] === currentPeriodRow[COLS.MES_NUM] && r[COLS.ANIO] === currentPeriodRow[COLS.ANIO]);
        const totalCasos = currentData.reduce((sum, r) => sum + (r[COLS.CASOS_MES_ACTUAL] || 0), 0);
        const tasaGlobal = poblacion > 0 ? (totalCasos / poblacion) * 100000 : 0;

        document.getElementById('v36_tasa').textContent = tasaGlobal.toFixed(1);

        // Chart Data
        const crimes = currentData.map(r => ({
            delito: r[COLS.DESCRIPCION],
            casos: r[COLS.CASOS_MES_ACTUAL] || 0,
            tasa: poblacion > 0 ? ((r[COLS.CASOS_MES_ACTUAL] || 0) / poblacion) * 100000 : 0
        })).sort((a, b) => b.tasa - a.tasa).slice(0, 5);

        const ctx = document.getElementById('chartTasaDelitoCead').getContext('2d');
        if (window.chart36) window.chart36.destroy();

        window.chart36 = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: crimes.map(c => c.delito),
                datasets: [
                    {
                        label: 'Tasa x 100k',
                        data: crimes.map(c => c.tasa),
                        backgroundColor: 'rgba(59, 130, 246, 0.7)',
                        yAxisID: 'y'
                    },
                    {
                        type: 'line',
                        label: 'Casos Absolutos',
                        data: crimes.map(c => c.casos),
                        borderColor: '#ef4444',
                        borderWidth: 2,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                scales: {
                    y: { beginAtZero: true, title: { display: true, text: 'Tasa x 100k' } },
                    y1: { beginAtZero: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Casos' } }
                }
            }
        });

    })();
</script>
