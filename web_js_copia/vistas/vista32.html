<!-- Vista 32: Próximo Peak  -->

<!-- Alert Box -->
<div class="alert alert--danger" id="alertIA12Cead">
    <strong>🤖 Interpretación de IA:</strong> <span id="alertText12Cead">Analizando patrones de picos...</span>
</div>

<!-- Section -->
<div class="card">
    <div class="section-header">
        <h2 class="section-title">¿Cuándo es posible el próximo peak? </h2>
    </div>
    <p class="text-muted mb-lg">Proyección de picos de actividad delictual (Meses)</p>

    <!-- Legend -->
    <div class="chart-legend mb-md">
        <div class="legend-item">
            <span class="legend-color" style="background: #3b82f6;"></span>
            Histórico
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #ef4444;"></span>
            Predicción de Peak
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-wrapper chart-wrapper--xl">
        <canvas id="chartPeakCead"></canvas>
    </div>
</div>

<style>
    .chart-legend {
        display: flex;
        justify-content: flex-end;
        gap: 1.5rem;
        padding: 0.5rem 0;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--color-text-muted);
    }

    .legend-color {
        width: 24px;
        height: 12px;
        border-radius: 3px;
    }
</style>

<script>
    (async function initVista32() {
        const waitForDataCead = () => new Promise(r => {
            const c = () => (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) ? r() : setTimeout(c, 100); c();
        });
        await waitForDataCead();
        await new Promise(r => { if (typeof Chart !== 'undefined') r(); else setTimeout(() => new Promise(x => setTimeout(x, 100)).then(r), 100); });

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allDataHistory;
        if (!data || data.length === 0) return;

        const MONTH_NAMES = ["", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

        // Get last 8-12 months
        // Group by Month
        const monthlyTotalsMap = {};
        data.forEach(row => {
            const key = `${row[COLS.ANIO]}-${String(row[COLS.MES_NUM]).padStart(2, '0')}`;
            const label = MONTH_NAMES[row[COLS.MES_NUM]] || String(row[COLS.MES]);
            if (!monthlyTotalsMap[key]) monthlyTotalsMap[key] = { label: label, total: 0 };
            monthlyTotalsMap[key].total += (row[COLS.CASOS_MES_ACTUAL] || 0);
        });

        const sortedKeys = Object.keys(monthlyTotalsMap).sort().slice(-8); // Last 8 months
        const totals = sortedKeys.map(k => monthlyTotalsMap[k].total);
        const labels = sortedKeys.map(k => monthlyTotalsMap[k].label);

        // Forecast next 4 months with simple pattern
        const lastValue = totals[totals.length - 1];
        const forecast = [];
        for (let i = 0; i < 4; i++) {
            const seasonal = Math.sin(i * 1.5) * (lastValue * 0.1);
            forecast.push(Math.round(lastValue + seasonal));
        }

        const maxForecast = Math.max(...forecast);
        const peakIndex = forecast.indexOf(maxForecast);

        // Integrate AI Module
        if (typeof IAModule !== 'undefined') {
            const localText = `Se pronostica un posible peak de actividad en <strong>+${peakIndex + 1} meses</strong> basado en patrones cíclicos mensuales.`;
            document.getElementById('alertText12Cead').innerHTML = localText;

            IAModule.getInterpretation('vista32').then(text => {
                if (text && text !== "Prediciendo próximos peaks de actividad...") {
                    document.getElementById('alertText12Cead').innerHTML = text;
                }
            });
        } else {
            document.getElementById('alertText12Cead').innerHTML =
                `Se pronostica un posible peak de actividad en <strong>+${peakIndex + 1} meses</strong> basado en patrones cíclicos mensuales.`;
        }

        const historicData = [...totals, ...Array(4).fill(null)];
        const forecastData = [...Array(totals.length - 1).fill(null), lastValue, ...forecast];

        const forecastLabels = Array.from({ length: 4 }, (_, i) => `+${i + 1} Mes`);
        const allLabels = [...labels, ...forecastLabels];

        new Chart(document.getElementById('chartPeakCead'), {
            type: 'line',
            data: {
                labels: allLabels,
                datasets: [
                    { label: 'Histórico', data: historicData, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3, pointRadius: 4 },
                    {
                        label: 'Predicción',
                        data: forecastData,
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239, 68, 68, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 6,
                        pointBackgroundColor: forecastData.map((v, i) => i === totals.length + peakIndex ? '#ef4444' : 'white')
                    }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'top' } },
                scales: { y: { beginAtZero: false }, x: { grid: { display: false } } }
            }
        });
    })();
</script>
