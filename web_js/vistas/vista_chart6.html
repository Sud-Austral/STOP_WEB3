<style>
    /* Estilos estandar de tarjeta (tomados de Vista 0) */
    .card-header {
        background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%);
        border-left: 4px solid var(--color-primary);
        padding: 0.5rem 0.8rem;
        margin-bottom: 0.6rem;
        border-radius: 0 8px 8px 0;
    }

    .card-header h2 {
        font-size: 1rem;
        font-weight: 800;
        color: var(--color-text);
        margin: 0;
        letter-spacing: -0.02em;
    }

    .card-header.header-yellow {
        background: linear-gradient(90deg, rgba(234, 179, 8, 0.1) 0%, transparent 100%);
        border-left-color: #eab308;
    }

    .card-header.header-green {
        background: linear-gradient(90deg, rgba(16, 185, 129, 0.1) 0%, transparent 100%);
        border-left-color: #10b981;
    }

    .description-box {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        margin-bottom: 0.75rem;
        font-size: 0.75rem;
        color: #475569;
        line-height: 1.4;
    }

    .description-box strong {
        color: #dc2626;
    }
</style>

<div class="card" style="padding: 1.5rem;">
    <!-- Encabezado 1 -->
    <div class="card-header">
        <h2>Análisis Histórico: Proyección Mensual vs Real</h2>
    </div>
    <div class="description-box">
        Comparativa de <strong>Proyección Mensual</strong> (Eje Izq) y <strong>Casos Semanales Reales</strong> (Eje
        Der).
    </div>

    <div style="height: 350px; position: relative; width: 100%; margin-bottom: 2rem;">
        <canvas id="chart6Canvas"></canvas>
    </div>

    <!-- Encabezado 2 -->
    <div class="card-header header-green">
        <h2>Promedios Diarios</h2>
    </div>
    <div class="description-box">
        Intensidad diaria calculada: <strong>Casos Semanales / 7</strong> vs <strong>Proyección Mensual / 30</strong>.
    </div>

    <div style="height: 250px; position: relative; width: 100%;">
        <canvas id="chart6Canvas_daily"></canvas>
    </div>

    <div
        style="margin-top: 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
        <div
            style="padding: 1rem; background: #f8fafc; border-radius: 8px; border-left: 4px solid var(--color-primary);">
            <div style="font-size: 0.8rem; color: var(--color-text-muted);">Última Proyección Mensual</div>
            <div id="v6_last_proy" style="font-size: 1.5rem; font-weight: 700; color: var(--color-text);">--</div>
        </div>
        <div style="padding: 1rem; background: #f8fafc; border-radius: 8px; border-left: 4px solid #eab308;">
            <div style="font-size: 0.8rem; color: var(--color-text-muted);">Últimos Casos Semanales</div>
            <div id="v6_last_real" style="font-size: 1.5rem; font-weight: 700; color: var(--color-text);">--</div>
        </div>
    </div>
</div>

<script>
    (async function initVistaChart6() {
        const waitForData = () => new Promise(resolve => {
            const check = () => (typeof STATE_DATA !== 'undefined' && STATE_DATA.isLoaded && STATE_DATA.allDataHistory_total?.length > 0) ? resolve() : setTimeout(check, 100);
            check();
        });
        await waitForData();

        const canvas1 = document.getElementById('chart6Canvas');
        const canvas2 = document.getElementById('chart6Canvas_daily');
        if (!canvas1 || !canvas2) return;

        // 1. Preparar Datos
        const data = [...STATE_DATA.allDataHistory_total].sort((a, b) => a[COLS.ID_SEMANA] - b[COLS.ID_SEMANA]);

        // Filtramos para mostrar las últimas 12 semanas
        const chartData = data.slice(-12);

        const labels = chartData.map(d => `Semana ${d[COLS.SEMANA]}/${d[COLS.ANIO]}`);
        const dates = chartData.map(d => d[COLS.FECHA] || '');

        // Datos Gráfico 1 (Original)
        const realValues = chartData.map(d => d[COLS.CASOS_ACTUAL] || 0);
        const proyValues = chartData.map(d => d[COLS.PROY_MES] || 0);
        const refValues = chartData.map(d => d[COLS.CASOS_MES_YEAR_ANT] || 0);

        // Datos Gráfico 2 (Promedios Diarios)
        const dailyFromWeekly = realValues.map(v => v / 7);
        const dailyFromMonthly = proyValues.map(v => v / 30);

        // Actualizar KPIs
        const lastRec = chartData[chartData.length - 1];
        if (lastRec) {
            document.getElementById('v6_last_proy').textContent = Math.round(lastRec[COLS.PROY_MES] || 0).toLocaleString('es-CL');
            document.getElementById('v6_last_real').textContent = Math.round(lastRec[COLS.CASOS_ACTUAL] || 0).toLocaleString('es-CL');
        }

        // TOOLTIP COMMON CONFIG
        const tooltipConfig = {
            callbacks: {
                title: (ctx) => {
                    const idx = ctx[0].dataIndex;
                    return `${dates[idx]} (${labels[idx]})`;
                },
                label: function (context) {
                    let label = context.dataset.label || '';
                    if (label) {
                        label += ': ';
                    }
                    if (context.parsed.y !== null) {
                        const val = context.parsed.y;
                        label += (val % 1 !== 0) ? val.toFixed(1).replace('.', ',') : Math.round(val).toLocaleString('es-CL');
                    }
                    return label;
                }
            }
        };

        // 2. Renderizar Gráfico 1
        if (window.chart6Instance) window.chart6Instance.destroy();

        const ctx1 = canvas1.getContext('2d');
        window.chart6Instance = new Chart(ctx1, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Proyección Mensual (Año Actual)',
                        data: proyValues,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        borderWidth: 2,
                        tension: 0.4,
                        fill: true,
                        pointRadius: 3,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Mismo Mes (Año Anterior)',
                        data: refValues,
                        borderColor: '#94a3b8',
                        backgroundColor: 'transparent',
                        borderWidth: 2,
                        borderDash: [5, 5],
                        tension: 0.4,
                        pointRadius: 0,
                        yAxisID: 'y'
                    },
                    {
                        label: 'Casos Reales (Semanal)',
                        type: 'bar',
                        data: realValues,
                        backgroundColor: 'rgba(234, 179, 8, 0.6)',
                        borderColor: 'rgb(234, 179, 8)',
                        borderWidth: 1,
                        borderRadius: 4,
                        yAxisID: 'y1'
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'top', labels: { font: { family: "'Outfit', sans-serif" }, usePointStyle: true } },
                    tooltip: tooltipConfig
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        position: 'left',
                        title: { display: true, text: 'Proyección Mensual' },
                        grid: { color: '#f1f5f9' }
                    },
                    y1: {
                        beginAtZero: true,
                        position: 'right',
                        title: { display: true, text: 'Casos Semanales' },
                        grid: { drawOnChartArea: false }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { maxTicksLimit: 12 }
                    }
                }
            }
        });

        // 3. Renderizar Gráfico 2
        if (window.chart6InstanceDaily) window.chart6InstanceDaily.destroy();

        const ctx2 = canvas2.getContext('2d');
        window.chart6InstanceDaily = new Chart(ctx2, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Promedio Diario (desde Semanal)',
                        data: dailyFromWeekly,
                        borderColor: '#eab308',
                        backgroundColor: 'rgba(234, 179, 8, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: false,
                        pointRadius: 3,
                        pointBackgroundColor: '#fff',
                        pointBorderColor: '#eab308'
                    },
                    {
                        label: 'Promedio Diario (desde Proy. Mensual)',
                        data: dailyFromMonthly,
                        borderColor: '#10b981',
                        backgroundColor: 'rgba(16, 185, 129, 0.1)',
                        borderWidth: 2,
                        tension: 0.3,
                        fill: true,
                        pointRadius: 3
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'top', labels: { font: { family: "'Outfit', sans-serif" }, usePointStyle: true } },
                    tooltip: tooltipConfig
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        title: { display: true, text: 'Casos Promedio por Día' },
                        grid: { color: '#f1f5f9' }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { maxTicksLimit: 12 }
                    }
                }
            }
        });

    })();
</script>
