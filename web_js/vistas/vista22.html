<!-- Vista 22: Alertas CEAD - Dashboard (Adaptado de Vista 2) -->

<!-- Section Header -->
<div class="card mb-lg">
    <!-- Location/Period and Source Row -->
    <div class="location-source-row" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
        <div style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
            <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill-cead">CARGANDO...</span>
            <span style="margin: 0 8px; color: #cbd5e1;">/</span>
            <span class="periodo-fill-cead">--</span>
        </div>
        <!-- Source badge will be injected here by app.js -->
        <div id="sourceBadgeContainer"></div>
    </div>

    <div class="question-section" style="background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%); border-left: 4px solid var(--color-primary); padding: 1rem 1.25rem; margin-top: -2rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0;">
        <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--color-text); margin: 0 0 0.25rem 0; letter-spacing: -0.02em;">
            ¿Hay alertas activas o anomalías ?
        </h2>
        <p style="color: var(--color-text-muted); margin: 0; font-size: 0.9rem;">Análisis de alertas por indicadores en la base de datos del CEAD</p>
    </div>

    <!-- Alert Box -->
    <div class="alert alert--warning mb-lg" id="alertIA2Cead">
        <strong>⚠️ Interpretación:</strong> <span id="alertText2Cead">Cargando análisis de alertas...</span>
    </div>

    <!-- Status Indicators -->
    <div class="status-indicators mb-lg">
        <div class="status-circle status-circle--warning" id="statusCircle1Cead">
            <span>⚠️</span>
        </div>
        <div class="status-circle status-circle--danger" id="statusCircle2Cead">
            <span>🔴</span>
        </div>
        <div class="status-circle status-circle--success" id="statusCircle3Cead">
            <span>✅</span>
        </div>
    </div>

    <div class="status-label">
        Estado Actual: <strong id="estadoActualCead">PRECAUCIÓN</strong>
    </div>

    <p class="trend-text" id="trendTextCead">
        --
    </p>
</div>

<!-- Comparison Chart -->
<div class="card">
    <h3 class="section-title mb-lg">Comparativa de Indicadores Clave (Mensual)</h3>
    <div class="chart-wrapper chart-wrapper--lg">
        <canvas id="chartComparativaCead"></canvas>
    </div>
</div>

<style>
    .status-indicators {
        display: flex;
        justify-content: center;
        gap: 2rem;
        padding: 1.5rem 0;
    }

    .status-circle {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        background: var(--color-bg);
        color: var(--color-text-light);
        transition: all 0.3s ease;
        opacity: 0.3;
        border: 2px solid transparent;
    }

    .status-circle.active {
        opacity: 1;
        transform: scale(1.1);
        border-color: rgba(0, 0, 0, 0.1);
    }

    .status-circle--warning.active {
        background: #fef3c7;
        color: #d97706;
        box-shadow: 0 0 15px rgba(217, 119, 6, 0.3);
    }

    .status-circle--danger.active {
        background: #fee2e2;
        color: #dc2626;
        box-shadow: 0 0 15px rgba(220, 38, 38, 0.3);
    }

    .status-circle--success.active {
        background: #d1fae5;
        color: #059669;
        box-shadow: 0 0 15px rgba(5, 150, 105, 0.3);
    }

    .status-label {
        text-align: center;
        font-size: 1.2rem;
        margin-bottom: 1rem;
    }

    .status-label strong {
        color: var(--color-warning);
        font-size: 1.5rem;
    }

    .trend-text {
        text-align: center;
        color: var(--color-text-muted);
    }
</style>

<script>
    (async function initVista22() {
        // Wait for CEAD data
        const waitForDataCead = () => {
            return new Promise((resolve) => {
                const check = () => {
                    if (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) {
                        resolve();
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        };

        await waitForDataCead();

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allData;

        if (!data || data.length === 0) return;

        // Current Period (Sorted Top 1)
        const currentPeriodRow = data[0];
        const currentMonthNum = currentPeriodRow[COLS.MES_NUM];
        const currentYear = currentPeriodRow[COLS.ANIO];

        // Filter current month data
        const currentMonthData = data.filter(row => row[COLS.MES_NUM] === currentMonthNum && row[COLS.ANIO] === currentYear);

        // Update Headers
        document.querySelectorAll('.comuna-fill-cead').forEach(el => el.textContent = STATE_DATA_CEAD.comunaName);
        document.querySelectorAll('.periodo-fill-cead').forEach(el => el.textContent = `${currentPeriodRow[COLS.MES]} ${currentPeriodRow[COLS.ANIO]}`);

        // Wait for Chart
        const waitForChart = () => new Promise(r => { if (typeof Chart !== 'undefined') r(); else setTimeout(() => waitForChart().then(r), 100); });
        await waitForChart();

        // Calculate Totals for Chart/Analysis
        const totalActual = currentMonthData.reduce((sum, row) => sum + (row[COLS.CASOS_MES_ACTUAL] || 0), 0);
        const totalAnt = currentMonthData.reduce((sum, row) => sum + (row[COLS.CASOS_MES_ANTERIOR] || 0), 0);
        const totalYearAnt = currentMonthData.reduce((sum, row) => sum + (row[COLS.CASOS_MISMO_MES_ANIO_ANTERIOR] || 0), 0);
        const mediaMovil = currentMonthData.reduce((sum, row) => sum + (row[COLS.MEDIA_MOVIL_4M] || 0), 0);

        // Calc Average Z-Score
        const avgZScore = currentMonthData.reduce((sum, row) => sum + (row[COLS.Z_SCORE] || 0), 0) / (currentMonthData.length || 1);

        // Find max Z-Score item
        let maxZDelito = currentMonthData[0] || {};
        currentMonthData.forEach(row => {
            if ((row[COLS.Z_SCORE] || 0) > (maxZDelito[COLS.Z_SCORE] || 0)) {
                maxZDelito = row;
            }
        });

        // Determine Status
        let status = 'NORMAL';
        let alertClass = 'alert--success';

        if (avgZScore > 1.5) {
            status = 'ALERTA';
            alertClass = 'alert--danger';
        } else if (avgZScore > 0.5) {
            status = 'PRECAUCIÓN';
            alertClass = 'alert--warning';
        }

        // Update DOM Elements
        const estadoEl = document.getElementById('estadoActualCead');
        estadoEl.textContent = status;
        estadoEl.style.color = status === 'ALERTA' ? '#ef4444' : status === 'PRECAUCIÓN' ? '#f59e0b' : '#10b981';

        // Update Circles
        const c1 = document.getElementById('statusCircle1Cead');
        const c2 = document.getElementById('statusCircle2Cead');
        const c3 = document.getElementById('statusCircle3Cead');

        // Reset
        c1.classList.remove('active'); c2.classList.remove('active'); c3.classList.remove('active');

        // Active
        if (status === 'PRECAUCIÓN') c1.classList.add('active');
        else if (status === 'ALERTA') c2.classList.add('active');
        else c3.classList.add('active');

        // Text
        const trendDirection = avgZScore > 0 ? 'creciente' : 'decreciente';
        document.getElementById('trendTextCead').innerHTML =
            `Se detectó una tendencia ${trendDirection} en <strong>${maxZDelito[COLS.DESCRIPCION] || 'N/A'}</strong> ` +
            `(Z-Score: ${(maxZDelito[COLS.Z_SCORE] || 0).toFixed(2)}).`;

        const alertEl = document.getElementById('alertIA2Cead');
        alertEl.className = `alert ${alertClass}`;
        document.getElementById('alertText2Cead').innerHTML =
            `Nivel de riesgo: <strong>${status}</strong>. Casos actuales: ${totalActual}. ` +
            `Media Móvil 4M: ${Math.round(mediaMovil)}.`;

        // Chart
        new Chart(document.getElementById('chartComparativaCead'), {
            type: 'bar',
            data: {
                labels: ['Casos Actuales', 'Media Móvil 4M', 'Mes Anterior', 'Mismo Mes Año Ant.'],
                datasets: [{
                    label: 'Casos',
                    data: [totalActual, Math.round(mediaMovil), totalAnt, totalYearAnt],
                    backgroundColor: ['#3b82f6', '#f59e0b', '#94a3b8', '#10b981'],
                    borderRadius: 8,
                    barThickness: 60
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'top' } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#e2e8f0' } },
                    x: { grid: { display: false } }
                }
            }
        });

    })();
</script>
