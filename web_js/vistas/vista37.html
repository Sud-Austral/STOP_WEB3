<!-- Vista 37: Contexto Regional (CEAD) -->
<div class="card">
    <div class="mb-sm" style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
        <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill-cead">CARGANDO...</span>
        <span style="margin: 0 8px; color: #cbd5e1;">/</span>
        <span class="periodo-fill-cead">--</span>
    </div>

    <div class="section-header">
        <h2 class="section-title">Posicionamiento Regional (CEAD)</h2>
    </div>
    <div class="d-flex justify-content-between align-items-center mb-lg">
        <p class="text-muted mb-0">Ranking comunal dentro de la región (Mensual)</p>
        <div class="badge bg-light text-dark border">
            <i class="fa-solid fa-map"></i> <span id="v37_provincia">--</span> / <span id="v37_region">--</span>
        </div>
    </div>

    <!-- Ranking KPIs -->
    <div class="kpi-grid mb-xl">
        <div class="kpi-card">
            <div class="kpi-label">Ranking Regional Promedio</div>
            <div class="kpi-value" id="v37_ranking">--</div>
            <div class="kpi-change" id="v37_ranking_change">--</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Variación Ranking</div>
            <div class="kpi-value" id="v37_rank_delta">--</div>
            <div class="kpi-sub">Puestos vs Mes Ant.</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Delitos en Top 5 Regional</div>
            <div class="kpi-value text-warning" id="v37_top_risk">--</div>
            <div class="kpi-sub" id="v37_top_risk_names">--</div>
        </div>
    </div>

    <!-- Chart: Ranking por Tipo de Delito -->
    <h4 class="card-title mt-lg">Posición en el Ranking por Delito (Menor es peor)</h4>
    <div class="chart-wrapper chart-wrapper--lg">
        <canvas id="chartRankingCead"></canvas>
    </div>
</div>

<script>
    (async function initVista37() {
        const waitForDataCead = () => new Promise(r => {
            const c = () => (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) ? r() : setTimeout(c, 100); c();
        });
        await waitForDataCead();
        await new Promise(r => { if (typeof Chart !== 'undefined') r(); else setTimeout(() => new Promise(x => setTimeout(x, 100)).then(r), 100); });

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allData;
        if (!data || data.length === 0) return;

        const currentPeriodRow = data[0];
        document.querySelectorAll('.comuna-fill-cead').forEach(el => el.textContent = STATE_DATA_CEAD.comunaName);
        document.querySelectorAll('.periodo-fill-cead').forEach(el => el.textContent = `${currentPeriodRow[COLS.MES]} ${currentPeriodRow[COLS.ANIO]}`);

        // Current Month Data
        const currentData = data.filter(r => r[COLS.MES_NUM] === currentPeriodRow[COLS.MES_NUM] && r[COLS.ANIO] === currentPeriodRow[COLS.ANIO]);

        if (currentData.length > 0) {
            document.getElementById('v37_provincia').textContent = currentData[0][COLS.PROVINCIA] || 'N/A';
            document.getElementById('v37_region').textContent = currentData[0][COLS.REGION] || 'N/A';
        }

        // Calculations
        let sumRank = 0, sumRankAnt = 0, count = 0;
        let badRankings = [];

        currentData.forEach(r => {
            const rank = parseInt(r[COLS.RANKING_COMUNAL_REGIONAL]) || 0;
            const rankAnt = parseInt(r[COLS.RANKING_COMUNAL_REGIONAL_MES_ANTERIOR]) || 0;

            if (rank > 0) {
                sumRank += rank;
                sumRankAnt += rankAnt;
                count++;
                if (rank <= 5) { // Top 5 is bad
                    badRankings.push(`${r[COLS.DESCRIPCION]} (#${rank})`);
                }
            }
        });

        const avgRank = count > 0 ? Math.round(sumRank / count) : 0;
        const avgRankAnt = count > 0 ? Math.round(sumRankAnt / count) : 0;

        document.getElementById('v37_ranking').textContent = avgRank > 0 ? '#' + avgRank : '--';

        const rankDelta = avgRankAnt - avgRank; // If Ant (8) - Curr (5) = +3. We moved to higher positions (Bad).
        // Wait. Rank 1 is usually worst (most crimes). So moving 8 -> 5 is getting worse (closer to #1).
        // Is positive delta bad?
        // Let's visualize: 5 is worse than 8.
        // Delta = 8 - 5 = 3. Positive means we moved TOWARDS 1. So Positive is BAD?
        // Let's standardise: Positive Delta in RANKING usually means Improvement (rising in number 5->8).
        // If we calculate old - new: 8 - 5 = 3.
        // Let's do new - old: 5 - 8 = -3. We dropped 3 places (closer to 1).
        // Let's stick to interpretation: Lower number is BAD.
        // So going down is BAD.

        const deltaVal = avgRank - avgRankAnt; // 5 - 8 = -3.
        const deltaText = deltaVal > 0 ? `▲ ${deltaVal} (Mejora)` : (deltaVal < 0 ? `▼ ${Math.abs(deltaVal)} (Empeora)` : 'Sin cambio');
        const deltaClass = deltaVal > 0 ? 'text-success' : (deltaVal < 0 ? 'text-danger' : 'text-muted');

        document.getElementById('v37_rank_delta').textContent = deltaText;
        document.getElementById('v37_rank_delta').className = `kpi-value ${deltaClass}`;

        document.getElementById('v37_top_risk').textContent = badRankings.length;
        document.getElementById('v37_top_risk_names').textContent = badRankings.slice(0, 3).join(', ');

        // Chart
        const sortedByRank = [...currentData].filter(r => (r[COLS.RANKING_COMUNAL_REGIONAL] || 0) > 0)
            .sort((a, b) => a[COLS.RANKING_COMUNAL_REGIONAL] - b[COLS.RANKING_COMUNAL_REGIONAL])
            .slice(0, 7);

        const ctx = document.getElementById('chartRankingCead').getContext('2d');
        if (window.chart37) window.chart37.destroy();

        window.chart37 = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: sortedByRank.map(r => r[COLS.DESCRIPCION]),
                datasets: [{
                    label: 'Ranking Regional',
                    data: sortedByRank.map(r => r[COLS.RANKING_COMUNAL_REGIONAL]),
                    backgroundColor: sortedByRank.map(r => r[COLS.RANKING_COMUNAL_REGIONAL] <= 5 ? '#ef4444' : '#64748b'),
                    borderRadius: 4
                }]
            },
            options: {
                indexAxis: 'y', responsive: true, maintainAspectRatio: false,
                scales: { x: { reverse: false, title: { display: true, text: 'Posición (1 = Más Delitos)' }, suggestedMin: 1 } }
            }
        });

    })();
</script>
