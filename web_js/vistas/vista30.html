<!-- Vista 30: Pronóstico Fin de Año  -->

<div class="card">
    <!-- Location/Period and Source Row -->
    <div class="location-source-row"
        style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
        <div style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
            <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill-cead">CARGANDO...</span>
            <span style="margin: 0 8px; color: #cbd5e1;">/</span>
            <span class="periodo-fill-cead">--</span>
        </div>
        <div id="sourceBadgeContainer"></div>
    </div>

    <div class="question-section"
        style="background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%); border-left: 4px solid var(--color-primary); padding: 1rem 1.25rem; margin-top: -2rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0;">
        <h2
            style="font-size: 1.5rem; font-weight: 800; color: var(--color-text); margin: 0 0 0.25rem 0; letter-spacing: -0.02em;">
            ¿Qué esperar hacia fin de año? </h2>
        <p style="color: var(--color-text-muted); margin: 0; font-size: 0.9rem;">Pronóstico mensual hacia delante con
            intervalos de certeza</p>
    </div>

    <!-- Alert Box -->
    <div class="alert alert--info" id="alertIA10Cead">
        <strong>🤖 Interpretación de IA:</strong> <span id="alertText10Cead">Calculando pronósticos...</span>
    </div>

    <!-- Legend -->
    <div class="chart-legend mb-md">
        <div class="legend-item">
            <span class="legend-color" style="background: #3b82f6;"></span>
            Histórico (Meses)
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #f59e0b;"></span>
            Proyección
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: rgba(249, 115, 22, 0.2); border: 1px dashed #f59e0b;"></span>
            Rango de Confianza
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-wrapper chart-wrapper--xl">
        <canvas id="chartPronosticoCead"></canvas>
    </div>

    <p class="chart-footnote text-muted">* Modelo predictivo basado en tendencia lineal mensual y desviación estándar
        histórica.</p>
</div>

<style>
    .chart-legend {
        display: flex;
        justify-content: flex-end;
        gap: 1.5rem;
        padding: 0.5rem 0;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--color-text-muted);
    }

    .legend-color {
        width: 24px;
        height: 12px;
        border-radius: 3px;
    }

    .chart-footnote {
        font-size: 0.75rem;
        margin-top: 1rem;
        font-style: italic;
        text-align: center;
    }
</style>

<script>
    (async function initVista30() {
        const waitForDataCead = () => new Promise(r => {
            const c = () => (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) ? r() : setTimeout(c, 100); c();
        });
        await waitForDataCead();
        await new Promise(r => { if (typeof Chart !== 'undefined') r(); else setTimeout(() => new Promise(x => setTimeout(x, 100)).then(r), 100); });

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allDataHistory;
        if (!data || data.length === 0) return;

        const MONTH_NAMES = ["", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

        // Group data by Month (YYYY-MM) for last 12 months
        // Similar to Vista 23 logic
        const monthlyTotalsMap = {};
        data.forEach(row => {
            const key = `${row[COLS.ANIO]}-${String(row[COLS.MES_NUM]).padStart(2, '0')}`;
            const label = MONTH_NAMES[row[COLS.MES_NUM]] || String(row[COLS.MES]); // Just Month name
            if (!monthlyTotalsMap[key]) monthlyTotalsMap[key] = { label: label, total: 0 };
            monthlyTotalsMap[key].total += (row[COLS.CASOS_MES_ACTUAL] || 0);
        });

        const sortedKeys = Object.keys(monthlyTotalsMap).sort().slice(-12);
        const monthlyTotals = sortedKeys.map(k => monthlyTotalsMap[k].total);
        const labels = sortedKeys.map(k => monthlyTotalsMap[k].label);

        // Linear prediction
        const n = monthlyTotals.length;
        if (n < 2) return;

        const xMean = (n - 1) / 2;
        const yMean = monthlyTotals.reduce((a, b) => a + b, 0) / n;
        let num = 0, den = 0;
        for (let i = 0; i < n; i++) { num += (i - xMean) * (monthlyTotals[i] - yMean); den += (i - xMean) ** 2; }
        const slope = den !== 0 ? num / den : 0;
        const intercept = yMean - slope * xMean;

        // Project 6 months
        const forecast = [], upperBound = [], lowerBound = [];
        const stdDev = Math.sqrt(monthlyTotals.reduce((sum, v) => sum + Math.pow(v - yMean, 2), 0) / n);

        for (let i = 0; i < 6; i++) {
            const projected = slope * (n + i) + intercept;
            const uncertainty = stdDev * (1 + i * 0.2); // Increasing uncertainty
            forecast.push(Math.round(projected));
            upperBound.push(Math.round(projected + uncertainty));
            lowerBound.push(Math.round(projected - uncertainty));
        }

        const projectLabels = Array.from({ length: 6 }, (_, i) => `+${i + 1} Mes`);
        const allLabels = [...labels, ...projectLabels];

        const historicData = [...monthlyTotals, ...Array(6).fill(null)];
        const forecastData = [...Array(n - 1).fill(null), monthlyTotals[n - 1], ...forecast];
        const upperData = [...Array(n - 1).fill(null), monthlyTotals[n - 1], ...upperBound];
        const lowerData = [...Array(n - 1).fill(null), monthlyTotals[n - 1], ...lowerBound];

        const trend = slope > 0 ? 'aumento' : 'disminución';

        // Integrate AI Module
        if (typeof IAModule !== 'undefined') {
            const localText = `El modelo mensual proyecta una ligera tendencia de <strong>${trend}</strong>. ` +
                `Los próximos 3 meses se mantendrían dentro del rango de confianza histórico.`;
            document.getElementById('alertText10Cead').innerHTML = localText;

            IAModule.getInterpretation('vista30').then(text => {
                if (text && text !== "Calculando proyección de fin de año...") {
                    document.getElementById('alertText10Cead').innerHTML = text;
                }
            });
        } else {
            document.getElementById('alertText10Cead').innerHTML =
                `El modelo mensual proyecta una ligera tendencia de <strong>${trend}</strong>. ` +
                `Los próximos 3 meses se mantendrían dentro del rango de confianza histórico.`;
        }

        new Chart(document.getElementById('chartPronosticoCead'), {
            type: 'line',
            data: {
                labels: allLabels,
                datasets: [
                    { label: 'Histórico', data: historicData, borderColor: '#3b82f6', backgroundColor: 'rgba(59, 130, 246, 0.1)', fill: true, tension: 0.3, pointRadius: 4 },
                    { label: 'Proyección', data: forecastData, borderColor: '#f59e0b', borderDash: [5, 5], fill: false, tension: 0.3, pointRadius: 4 },
                    { label: 'Límite Superior', data: upperData, borderColor: 'transparent', backgroundColor: 'rgba(249, 115, 22, 0.15)', fill: '+1', tension: 0.3, pointRadius: 0 },
                    { label: 'Límite Inferior', data: lowerData, borderColor: 'transparent', fill: false, tension: 0.3, pointRadius: 0 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'top' } },
                scales: { y: { beginAtZero: false }, x: { grid: { display: false } } }
            }
        });
    })();
</script>
