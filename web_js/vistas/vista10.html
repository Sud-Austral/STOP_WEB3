<!-- Vista 10: Correlaciones -->

<!-- Correlation Matrix -->
<div class="card mb-lg">
    <h2 class="section-title mb-lg">Matriz de Correlación</h2>

    <table class="table" style="text-align: center;">
        <thead>
            <tr>
                <th></th>
                <th>Desempleo</th>
                <th>Pobreza</th>
                <th>Educación</th>
                <th>Densidad</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td><strong>Robos</strong></td>
                <td style="background: #fecaca; color: #991b1b; font-weight: 600;">0.85</td>
                <td style="background: #fecaca; color: #991b1b; font-weight: 600;">0.78</td>
                <td style="background: #fef3c7; color: #92400e; font-weight: 600;">-0.45</td>
                <td style="background: #fef3c7; color: #92400e; font-weight: 600;">0.52</td>
            </tr>
            <tr>
                <td><strong>Hurtos</strong></td>
                <td style="background: #fef3c7; color: #92400e; font-weight: 600;">0.62</td>
                <td style="background: #fef3c7; color: #92400e; font-weight: 600;">0.55</td>
                <td style="background: #dcfce7; color: #166534; font-weight: 600;">-0.32</td>
                <td style="background: #fecaca; color: #991b1b; font-weight: 600;">0.75</td>
            </tr>
            <tr>
                <td><strong>Violencia</strong></td>
                <td style="background: #fecaca; color: #991b1b; font-weight: 600;">0.72</td>
                <td style="background: #fecaca; color: #991b1b; font-weight: 600;">0.82</td>
                <td style="background: #fef3c7; color: #92400e; font-weight: 600;">-0.58</td>
                <td style="background: #dcfce7; color: #166534; font-weight: 600;">0.28</td>
            </tr>
        </tbody>
    </table>
</div>

<!-- Charts -->
<div class="chart-grid chart-grid--2">
    <div class="chart-card">
        <div class="chart-card-title">Delitos vs Tasa de Desempleo</div>
        <div class="chart-wrapper">
            <canvas id="chartDesempleo"></canvas>
        </div>
    </div>
    <div class="chart-card">
        <div class="chart-card-title">Delitos vs Densidad Poblacional</div>
        <div class="chart-wrapper">
            <canvas id="chartDensidad"></canvas>
        </div>
    </div>
</div>

<script>
    ChartHelper.init(() => {
        new Chart(document.getElementById('chartDesempleo'), {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Comunas',
                    data: [{ x: 5, y: 120 }, { x: 7, y: 145 }, { x: 9, y: 180 }, { x: 11, y: 220 }, { x: 13, y: 280 }, { x: 8, y: 160 }],
                    backgroundColor: '#3b82f6',
                    pointRadius: 8
                }]
            },
            options: {
                ...ChartHelper.defaultOptions,
                plugins: { legend: { display: false } },
                scales: {
                    x: { title: { display: true, text: 'Tasa Desempleo (%)' } },
                    y: { title: { display: true, text: 'Casos Delictuales' } }
                }
            }
        });

        new Chart(document.getElementById('chartDensidad'), {
            type: 'scatter',
            data: {
                datasets: [{
                    label: 'Comunas',
                    data: [{ x: 2000, y: 80 }, { x: 5000, y: 150 }, { x: 8000, y: 200 }, { x: 12000, y: 320 }, { x: 15000, y: 380 }],
                    backgroundColor: '#f59e0b',
                    pointRadius: 8
                }]
            },
            options: {
                ...ChartHelper.defaultOptions,
                plugins: { legend: { display: false } },
                scales: {
                    x: { title: { display: true, text: 'Habitantes / km²' } },
                    y: { title: { display: true, text: 'Casos Delictuales' } }
                }
            }
        });
    });
</script>
