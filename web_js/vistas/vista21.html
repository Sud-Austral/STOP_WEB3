<!-- Vista 21: Ficha CEAD - Dashboard Principal (Adaptado de Vista 1) -->

<!-- Section: Situación General CEAD -->
<div class="card mb-lg">
    <!-- Location/Period and Source Row -->
    <div class="location-source-row"
        style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
        <div style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
            <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill-cead">CARGANDO...</span>
            <span style="margin: 0 8px; color: #cbd5e1;">/</span>
            <span class="periodo-fill-cead">--</span>
        </div>
        <!-- Source badge will be injected here by app.js -->
        <div id="sourceBadgeContainer"></div>
    </div>

    <div class="question-section"
        style="background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%); border-left: 4px solid var(--color-primary); padding: 1rem 1.25rem; margin-top: -2rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0;">
        <h2
            style="font-size: 1.5rem; font-weight: 800; color: var(--color-text); margin: 0 0 0.25rem 0; letter-spacing: -0.02em;">
            Situación General
        </h2>
        <p style="color: var(--color-text-muted); margin: 0; font-size: 0.9rem;">Estado mensual de seguridad basado en
            datos CEAD</p>
    </div>

    <!-- Alert Box -->
    <div class="alert alert--warning mb-lg" id="alertIACead">
        <strong>📊 Resumen:</strong> <span id="alertTextCead">Cargando análisis...</span>
    </div>

    <div class="kpi-grid" id="kpiGridCead">
        <div class="kpi-card">
            <div class="kpi-label">Casos del Mes</div>
            <div class="kpi-value" id="kpiCasosCead">--</div>
            <div class="kpi-change" id="kpiCasosChangeCead">--</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Variación Anual</div>
            <div class="kpi-value" id="kpiVarAnualCead">--</div>
            <div class="kpi-change" id="kpiVarAnualChangeCead">vs Año Anteior</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">Acumulado Anual</div>
            <div class="kpi-value" id="kpiAcumuladoCead">--</div>
            <div class="kpi-change kpi-change--neutral">Total año actual</div>
        </div>
        <div class="kpi-card">
            <div class="kpi-label">NIVEL DE RIESGO</div>
            <div class="kpi-value" id="kpiRiesgoCead">--</div>
            <div class="kpi-change kpi-change--neutral" id="kpiRiesgoLabelCead">--</div>
        </div>
    </div>
</div>

<!-- Charts Section -->
<div class="chart-card mb-lg">
    <h3 class="section-title mb-lg">Distribución de Casos (Mes Actual)</h3>
    <div class="chart-wrapper chart-wrapper--lg">
        <canvas id="chartDistribucionCead"></canvas>
    </div>
</div>
<div class="chart-card">
    <h3 class="section-title mb-lg">Tendencia Mensual</h3>
    <div class="chart-wrapper chart-wrapper--lg">
        <canvas id="chartEvolucionCead"></canvas>
    </div>
</div>

<script>
    (async function initVista21() {
        // Wait for CEAD data
        const waitForDataCead = () => {
            return new Promise((resolve) => {
                const check = () => {
                    if (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) {
                        resolve();
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        };

        await waitForDataCead();

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allData; // Sorted desc by date in loader

        const MONTH_NAMES = ["", "Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];

        if (!data || data.length === 0) {
            document.getElementById('alertTextCead').textContent = "No hay datos disponibles para esta comuna.";
            return;
        }

        // Get Current Period (Top 1 from sorted data)
        const currentPeriodRow = data[0];
        const currentMonthNum = currentPeriodRow[COLS.MES_NUM];
        const currentYear = currentPeriodRow[COLS.ANIO];

        // Filter data for the current month/year to aggregate totals if needed
        // Assuming data is one row per delito per month? Or aggregated?
        // Usually CEAD data is granular by crime type.
        const currentMonthData = data.filter(row => row[COLS.MES_NUM] === currentMonthNum && row[COLS.ANIO] === currentYear);

        // Update Header
        document.querySelectorAll('.comuna-fill-cead').forEach(el => el.textContent = STATE_DATA_CEAD.comunaName);
        document.querySelectorAll('.periodo-fill-cead').forEach(el => el.textContent = `${currentPeriodRow[COLS.MES]} ${currentPeriodRow[COLS.ANIO]}`);

        // Wait for Chart.js
        const waitForChart = () => {
            return new Promise((resolve) => {
                if (typeof Chart !== 'undefined') resolve();
                else setTimeout(() => waitForChart().then(resolve), 100);
            });
        };
        await waitForChart();

        // 1. Calculate KPIs (Aggregated for all crimes in this view, similar to Vista 1 overview)
        const totalCasos = currentMonthData.reduce((sum, row) => sum + (row[COLS.CASOS_MES_ACTUAL] || 0), 0);
        const totalCasosAnt = currentMonthData.reduce((sum, row) => sum + (row[COLS.CASOS_MES_ANTERIOR] || 0), 0);
        const totalCasosAnioAnt = currentMonthData.reduce((sum, row) => sum + (row[COLS.CASOS_MISMO_MES_ANIO_ANTERIOR] || 0), 0);

        const acumuladoAnual = currentMonthData.reduce((sum, row) => sum + (row[COLS.ACUMULADO_ANUAL] || 0), 0);

        // Calc Variations
        const varMensual = totalCasosAnt > 0 ? ((totalCasos - totalCasosAnt) / totalCasosAnt * 100).toFixed(1) : 0;
        const varAnual = totalCasosAnioAnt > 0 ? ((totalCasos - totalCasosAnioAnt) / totalCasosAnioAnt * 100).toFixed(1) : 0;

        // Risk / Z-Score
        const avgZScore = currentMonthData.reduce((sum, row) => sum + (row[COLS.Z_SCORE] || 0), 0) / (currentMonthData.length || 1);

        let riskLevel = 'BAJO';
        let riskColor = 'text-success';
        if (avgZScore > 1.5) { riskLevel = 'ALTO'; riskColor = 'text-danger'; }
        else if (avgZScore > 0.5) { riskLevel = 'MEDIO'; riskColor = 'text-warning'; }

        // Update DOM
        document.getElementById('kpiCasosCead').textContent = totalCasos.toLocaleString();
        const kpiChangeEl = document.getElementById('kpiCasosChangeCead');
        kpiChangeEl.textContent = `${varMensual >= 0 ? '▲' : '▼'} ${Math.abs(varMensual)}% vs Mes Ant.`;
        kpiChangeEl.className = `kpi-change ${varMensual >= 0 ? 'text-danger' : 'text-success'}`; // Assuming increase is bad

        document.getElementById('kpiVarAnualCead').textContent = `${varAnual >= 0 ? '+' : ''}${varAnual}%`;
        document.getElementById('kpiVarAnualCead').className = `kpi-value ${varAnual >= 0 ? 'text-danger' : 'text-success'}`;

        document.getElementById('kpiAcumuladoCead').textContent = acumuladoAnual.toLocaleString();

        document.getElementById('kpiRiesgoCead').textContent = riskLevel;
        document.getElementById('kpiRiesgoCead').className = `kpi-value ${riskColor}`;
        document.getElementById('kpiRiesgoLabelCead').textContent = `Z-Score: ${avgZScore.toFixed(2)}`;

        // Alert Text
        const alertEl = document.getElementById('alertIACead');
        alertEl.className = `alert ${avgZScore > 1.5 ? 'alert--danger' : avgZScore > 0.5 ? 'alert--warning' : 'alert--success'}`;
        document.getElementById('alertTextCead').innerHTML =
            `En <strong>${STATE_DATA_CEAD.lastMonth}</strong>, los casos ${varMensual >= 0 ? 'aumentaron' : 'bajaron'} un ${Math.abs(varMensual)}% respecto al mes anterior. ` +
            `La variación interanual es del <strong>${varAnual}%</strong>.`;

        // 2. Chart: Distribution by Crime Type (Descripcion)
        const delitoGroups = {};
        currentMonthData.forEach(row => {
            const delito = row[COLS.DESCRIPCION];
            delitoGroups[delito] = (delitoGroups[delito] || 0) + (row[COLS.CASOS_MES_ACTUAL] || 0);
        });

        const sortedDelitos = Object.entries(delitoGroups)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 6); // Top 6

        const totalChart = sortedDelitos.reduce((sum, d) => sum + d[1], 0);

        new Chart(document.getElementById('chartDistribucionCead'), {
            type: 'doughnut',
            data: {
                labels: sortedDelitos.map(d => d[0].length > 20 ? d[0].substring(0, 20) + '...' : d[0]),
                datasets: [{
                    data: sortedDelitos.map(d => d[1]),
                    backgroundColor: ['#3b82f6', '#ef4444', '#f59e0b', '#10b981', '#8b5cf6', '#64748b']
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '55%',
                plugins: {
                    legend: {
                        position: 'right',
                        labels: {
                            font: { size: 10 },
                            boxWidth: 12,
                            generateLabels: function (chart) {
                                const data = chart.data;
                                return data.labels.map((label, i) => {
                                    const value = data.datasets[0].data[i];
                                    const pct = ((value / totalChart) * 100).toFixed(1);
                                    return {
                                        text: `${label}: ${value} (${pct}%)`,
                                        fillStyle: data.datasets[0].backgroundColor[i],
                                        hidden: false,
                                        index: i
                                    };
                                });
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function (context) {
                                const value = context.raw;
                                const pct = ((value / totalChart) * 100).toFixed(1);
                                return `${context.label}: ${value} casos (${pct}%)`;
                            }
                        }
                    },
                    datalabels: {
                        color: '#fff',
                        font: { weight: 'bold', size: 11 },
                        formatter: function (value, context) {
                            const pct = ((value / totalChart) * 100).toFixed(0);
                            return `${value}\n(${pct}%)`;
                        },
                        textAlign: 'center',
                        display: function (context) {
                            const pct = (context.dataset.data[context.dataIndex] / totalChart) * 100;
                            return pct > 5;
                        }
                    }
                }
            },
            plugins: [ChartDataLabels]
        });

        // 3. Chart: Evolution (Last 12 months?)
        // We need to aggregate totals per month history
        // Get unique Month-Year combinations from allData
        const monthlyTotalsMap = {};
        STATE_DATA_CEAD.allData.forEach(row => {
            const key = `${row[COLS.ANIO]}-${String(row[COLS.MES_NUM]).padStart(2, '0')}`; // YYYY-MM for sorting
            const monthName = MONTH_NAMES[row[COLS.MES_NUM]] || String(row[COLS.MES]);
            const label = `${monthName} ${row[COLS.ANIO]}`;
            if (!monthlyTotalsMap[key]) monthlyTotalsMap[key] = { label: label, total: 0 };
            monthlyTotalsMap[key].total += (row[COLS.CASOS_MES_ACTUAL] || 0);
        });

        const sortedKeys = Object.keys(monthlyTotalsMap).sort().slice(-12); // Last 12 months
        const evolutionLabels = sortedKeys.map(k => monthlyTotalsMap[k].label);
        const evolutionData = sortedKeys.map(k => monthlyTotalsMap[k].total);

        new Chart(document.getElementById('chartEvolucionCead'), {
            type: 'line',
            data: {
                labels: evolutionLabels,
                datasets: [{
                    label: 'Total Casos',
                    data: evolutionData,
                    borderColor: '#3b82f6',
                    backgroundColor: 'rgba(59, 130, 246, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'top' } },
                scales: { y: { beginAtZero: true } }
            }
        });

    })();
</script>
