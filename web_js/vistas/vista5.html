<!-- Vista 5: ¿La violencia está aumentando o son solo delitos menores? -->

<!-- Section -->
<div class="card">
    <!-- Location/Week and Source Row -->
    <div class="location-source-row"
        style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
        <div style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
            <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill">CARGANDO...</span>
            <span style="margin: 0 8px; color: #cbd5e1;">/</span>
            <span class="semana-fill">--</span>
        </div>
        <!-- Source badge will be injected here by app.js -->
        <div id="sourceBadgeContainer"></div>
    </div>

    <div class="question-section"
        style="background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%); border-left: 4px solid var(--color-primary); padding: 1rem 1.25rem; margin-top: -2rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0;">
        <h2
            style="font-size: 1.5rem; font-weight: 800; color: var(--color-text); margin: 0 0 0.25rem 0; letter-spacing: -0.02em;">
            ¿La violencia está aumentando o son solo delitos menores?
        </h2>
        <p style="color: var(--color-text-muted); margin: 0; font-size: 0.9rem;">Perspectiva de la distribución de los
            delitos según su naturaleza</p>
    </div>

    <!-- Alert Box -->
    <div class="alert alert--info mb-lg" id="alertIA5">
        <strong>📊 Análisis de Perfil:</strong> <span id="alertText5">Analizando perfil delictual...</span>
    </div>

    <!-- Legend -->
    <h3 class="section-title mb-lg">Perfil Delictual Comparado</h3>
    <div class="chart-legend mb-md">
        <div class="legend-item">
            <span class="legend-color" style="background: #3b82f6;"></span>
            Casos Semana Actual
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #94a3b8;"></span>
            Casos Semana Anterior
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #f59e0b;"></span>
            Promedio Histórico
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-card-premium chart-section">
        <div class="chart-wrapper chart-wrapper--fixed-lg">
            <canvas id="chartPerfil"></canvas>
        </div>
        <div id="chartSourceFooter"></div>
    </div>
</div>

<style>
    .chart-legend {
        display: flex;
        justify-content: flex-end;
        gap: 1.5rem;
        padding: 0.5rem 0;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--color-text-muted);
    }

    .legend-color {
        width: 24px;
        height: 12px;
        border-radius: 3px;
    }
</style>

<script>
    (async function initVista5() {
        const waitForData = () => new Promise(resolve => {
            const check = () => (typeof STATE_DATA !== 'undefined' && STATE_DATA.allDataHistory?.length > 0) ? resolve() : setTimeout(check, 100);
            check();
        });
        await waitForData();

        // Update Header Info
        document.querySelectorAll('.comuna-fill').forEach(el => el.textContent = STATE_DATA.comunaName.toUpperCase());
        document.querySelectorAll('.semana-fill').forEach(el => el.textContent = STATE_DATA.semanaDetalle);

        // Process data
        await new Promise(resolve => { const c = () => typeof Chart !== 'undefined' ? resolve() : setTimeout(c, 100); c(); });

        const maxSemana = Math.max(...STATE_DATA.allDataHistory.map(r => r[COLS.ID_SEMANA]));
        const currentData = STATE_DATA.allDataHistory.filter(r => r[COLS.ID_SEMANA] === maxSemana);

        // Get top 6 delitos by cases
        const sortedDelitos = [...currentData].sort((a, b) => (b[COLS.CASOS_ACTUAL] || 0) - (a[COLS.CASOS_ACTUAL] || 0)).slice(0, 6);

        // #11 - Get full delito names for semantic colors
        const fullLabels = sortedDelitos.map(r => r[COLS.DELITO] || 'Sin nombre');
        const labels = fullLabels.map(name => name.length > 25 ? name.substring(0, 22) + '...' : name);

        const actual = sortedDelitos.map(r => r[COLS.CASOS_ACTUAL] || 0);
        const anterior = sortedDelitos.map(r => r[COLS.CASOS_ANT] || 0);
        const historico = sortedDelitos.map(r => r[COLS.PROMEDIO_HIST] || 0);

        // Calculate totals for analysis
        const totalActual = actual.reduce((a, b) => a + b, 0);
        const totalAnterior = anterior.reduce((a, b) => a + b, 0);
        const change = totalAnterior > 0 ? ((totalActual - totalAnterior) / totalAnterior * 100).toFixed(1) : 0;

        // Try AI interpretation
        if (typeof IAModule !== 'undefined') {
            IAModule.getInterpretation('vista5').then(interpretation => {
                document.getElementById('alertText5').innerHTML = interpretation;
            });
        } else {
            document.getElementById('alertText5').innerHTML =
                `Los delitos asociados a <strong>VIOLENCIA</strong> han variado un <strong>${Math.abs(change)}%</strong>. ` +
                `Esto podría indicar percepción de inseguridad para la comunidad.`;
        }

        // #10 - Add source footer
        document.getElementById('chartSourceFooter').innerHTML = ChartHelper.getSourceFooterHtml('STOP');

        // Only create chart if we have data
        if (sortedDelitos.length === 0) {
            document.getElementById('chartPerfil').parentElement.innerHTML = '<p class="text-muted">No hay datos disponibles</p>';
            return;
        }

        const canvas = document.getElementById('chartPerfil');
        const ctx = canvas.getContext('2d');

        // #1 - Create gradients
        const gradientActual = ctx.createLinearGradient(0, 0, 0, 400);
        gradientActual.addColorStop(0, '#60a5fa');
        gradientActual.addColorStop(1, '#2563eb');

        const gradientAnterior = ctx.createLinearGradient(0, 0, 0, 400);
        gradientAnterior.addColorStop(0, '#94a3b8');
        gradientAnterior.addColorStop(1, '#64748b');

        const gradientHistorico = ctx.createLinearGradient(0, 0, 0, 400);
        gradientHistorico.addColorStop(0, '#fbbf24');
        gradientHistorico.addColorStop(1, '#d97706');

        // #15 - Find max value for highlight
        const maxIdx = ChartHelper.findMaxIndex(actual);

        // #16 - Calculate average for annotation line
        const avgActual = actual.reduce((a, b) => a + b, 0) / actual.length;

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Casos Actual',
                        data: actual,
                        backgroundColor: gradientActual,
                        borderRadius: 8,
                        borderSkipped: false
                    },
                    {
                        label: 'Casos Anterior',
                        data: anterior,
                        backgroundColor: gradientAnterior,
                        borderRadius: 8,
                        borderSkipped: false
                    },
                    {
                        label: 'Promedio Hist.',
                        data: historico,
                        backgroundColor: gradientHistorico,
                        borderRadius: 8,
                        borderSkipped: false
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top',
                        labels: {
                            font: { family: 'Outfit, sans-serif', size: 11, weight: '500' },
                            usePointStyle: true,
                            pointStyle: 'rectRounded',
                            padding: 15
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(15, 23, 42, 0.95)',
                        titleFont: { family: 'Outfit, sans-serif', size: 13, weight: '600' },
                        bodyFont: { family: 'Outfit, sans-serif', size: 12 },
                        padding: 12,
                        cornerRadius: 8,
                        callbacks: {
                            label: function (context) {
                                const value = context.raw;
                                const pct = totalActual > 0 ? ((value / totalActual) * 100).toFixed(1) : 0;
                                return `${context.dataset.label}: ${ChartHelper.formatNumber(value)} (${pct}%)`;
                            }
                        }
                    },
                    // #31, #32 - Data labels with value and percentage
                    datalabels: {
                        display: function (context) {
                            // Only show for first dataset (actual cases)
                            return context.datasetIndex === 0;
                        },
                        anchor: 'end',
                        align: 'top',
                        offset: 4,
                        color: function (context) {
                            // #15 - Highlight max
                            return context.dataIndex === maxIdx ? '#d97706' : '#1e293b';
                        },
                        font: function (context) {
                            return {
                                family: 'Outfit, sans-serif',
                                size: context.dataIndex === maxIdx ? 12 : 10,
                                weight: context.dataIndex === maxIdx ? '800' : '600'
                            };
                        },
                        formatter: function (value) {
                            const pct = totalActual > 0 ? ((value / totalActual) * 100).toFixed(0) : 0;
                            return `${ChartHelper.formatNumber(value)} (${pct}%)`;
                        }
                    },
                    // #16 - Average line annotation
                    annotation: {
                        annotations: {
                            avgLine: {
                                type: 'line',
                                borderColor: '#ef4444',
                                borderWidth: 2,
                                borderDash: [6, 4],
                                label: {
                                    display: true,
                                    content: `Promedio: ${ChartHelper.formatNumber(avgActual, 1)}`,
                                    position: 'end',
                                    backgroundColor: '#ef4444',
                                    color: '#fff',
                                    font: { family: 'Outfit, sans-serif', size: 10, weight: '600' },
                                    padding: 4
                                },
                                scaleID: 'y',
                                value: avgActual
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(226, 232, 240, 0.8)', drawBorder: false },
                        ticks: {
                            font: { family: 'Outfit, sans-serif', size: 10 },
                            color: '#64748b',
                            callback: function (value) { return ChartHelper.formatNumber(value); }
                        }
                    },
                    x: {
                        grid: { display: false },
                        ticks: {
                            font: { family: 'Outfit, sans-serif', size: 9 },
                            color: '#64748b',
                            maxRotation: 45,
                            minRotation: 0
                        }
                    }
                }
            },
            plugins: [ChartDataLabels]
        });
    })();
</script>
