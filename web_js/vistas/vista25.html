<!-- Vista 25: Perfil Delictual  -->

<!-- Section -->
<div class="card">
    <!-- Location/Period and Source Row -->
    <div class="location-source-row" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
        <div style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
            <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill-cead">CARGANDO...</span>
            <span style="margin: 0 8px; color: #cbd5e1;">/</span>
            <span class="periodo-fill-cead">--</span>
        </div>
        <!-- Source badge will be injected here by app.js -->
        <div id="sourceBadgeContainer"></div>
    </div>

    <div class="question-section" style="background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%); border-left: 4px solid var(--color-primary); padding: 1rem 1.25rem; margin-top: -2rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0;">
        <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--color-text); margin: 0 0 0.25rem 0; letter-spacing: -0.02em;">
            ¿La violencia está aumentando o son solo delitos menores? 
        </h2>
        <p style="color: var(--color-text-muted); margin: 0; font-size: 0.9rem;">Perspectiva de la distribución de los delitos según su naturaleza mensual</p>
    </div>

    <!-- Alert Box -->
    <div class="alert alert--info mb-lg" id="alertIA5Cead">
        <strong>📊 Análisis de Perfil:</strong> <span id="alertText5Cead">Analizando perfil delictual...</span>
    </div>

    <!-- Legend -->
    <div class="chart-legend mb-md">
        <div class="legend-item">
            <span class="legend-color" style="background: #3b82f6;"></span>
            Casos Mes Actual
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #94a3b8;"></span>
            Casos Mes Anterior
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #f59e0b;"></span>
            Promedio Histórico
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-wrapper chart-wrapper--xl">
        <canvas id="chartPerfilCead"></canvas>
    </div>
</div>

<style>
    .chart-legend {
        display: flex;
        justify-content: flex-end;
        gap: 1.5rem;
        padding: 0.5rem 0;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--color-text-muted);
    }

    .legend-color {
        width: 24px;
        height: 12px;
        border-radius: 3px;
    }
</style>

<script>
    (async function initVista25() {
        // Wait for CEAD data
        const waitForDataCead = () => {
            return new Promise((resolve) => {
                const check = () => {
                    if (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) {
                        resolve();
                    } else {
                        setTimeout(check, 100);
                    }
                };
                check();
            });
        };

        await waitForDataCead();

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allData;

        if (!data || data.length === 0) return;

        const currentPeriodRow = data[0];
        const currentMonthNum = currentPeriodRow[COLS.MES_NUM];
        const currentYear = currentPeriodRow[COLS.ANIO];

        const currentMonthData = data.filter(row => row[COLS.MES_NUM] === currentMonthNum && row[COLS.ANIO] === currentYear);

        // Update Headers
        document.querySelectorAll('.comuna-fill-cead').forEach(el => el.textContent = STATE_DATA_CEAD.comunaName);
        document.querySelectorAll('.periodo-fill-cead').forEach(el => el.textContent = `${currentPeriodRow[COLS.MES]} ${currentPeriodRow[COLS.ANIO]}`);

        // Wait for Chart
        const waitForChart = () => new Promise(r => { if (typeof Chart !== 'undefined') r(); else setTimeout(() => waitForChart().then(r), 100); });
        await waitForChart();

        // Sort by cases (Top 6)
        const sortedDelitos = [...currentMonthData]
            .sort((a, b) => (b[COLS.CASOS_MES_ACTUAL] || 0) - (a[COLS.CASOS_MES_ACTUAL] || 0))
            .slice(0, 6);

        const labels = sortedDelitos.map(r => {
            const name = r[COLS.DESCRIPCION] || 'Sin nombre';
            return name.length > 25 ? name.substring(0, 22) + '...' : name;
        });

        const actual = sortedDelitos.map(r => r[COLS.CASOS_MES_ACTUAL] || 0);
        const anterior = sortedDelitos.map(r => r[COLS.CASOS_MES_ANTERIOR] || 0);
        const historico = sortedDelitos.map(r => r[COLS.PROMEDIO_HIST] || 0);

        const totalActual = actual.reduce((a, b) => a + b, 0);
        const totalAnterior = anterior.reduce((a, b) => a + b, 0);
        const change = totalAnterior > 0 ? ((totalActual - totalAnterior) / totalAnterior * 100).toFixed(1) : 0;

        document.getElementById('alertText5Cead').innerHTML =
            `La actividad delictual ha variado un <strong>${Math.abs(change)}%</strong> respecto al mes anterior. ` +
            `Compare las barras azules (Mes Actual) vs grises (Mes Anterior).`;

        if (sortedDelitos.length === 0) {
            document.getElementById('chartPerfilCead').parentElement.innerHTML = '<p class="text-muted">No hay datos disponibles</p>';
            return;
        }

        new Chart(document.getElementById('chartPerfilCead'), {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Mes Actual', data: actual, backgroundColor: '#3b82f6', borderRadius: 4 },
                    { label: 'Mes Anterior', data: anterior, backgroundColor: '#94a3b8', borderRadius: 4 },
                    { label: 'Promedio Hist.', data: historico, backgroundColor: '#f59e0b', borderRadius: 4 }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'top' } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#e2e8f0' } },
                    x: { grid: { display: false } }
                }
            }
        });
    })();
</script>
