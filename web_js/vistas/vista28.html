<!-- Vista 28: Estacionalidad  -->

<!-- Section -->
<div class="card">
    <!-- Location/Period and Source Row -->
    <div class="location-source-row" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem;">
        <div style="font-size: 0.8rem; color: var(--color-primary); font-weight: 600; letter-spacing: 0.5px;">
            <i class="fa-solid fa-location-dot"></i> <span class="comuna-fill-cead">CARGANDO...</span>
            <span style="margin: 0 8px; color: #cbd5e1;">/</span>
            <span class="periodo-fill-cead">--</span>
        </div>
        <div id="sourceBadgeContainer"></div>
    </div>

    <div class="question-section" style="background: linear-gradient(90deg, rgba(59, 130, 246, 0.1) 0%, transparent 100%); border-left: 4px solid var(--color-primary); padding: 1rem 1.25rem; margin-top: -2rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0;">
        <h2 style="font-size: 1.5rem; font-weight: 800; color: var(--color-text); margin: 0 0 0.25rem 0; letter-spacing: -0.02em;">
            ¿Existe estacionalidad? 
        </h2>
        <p style="color: var(--color-text-muted); margin: 0; font-size: 0.9rem;">Análisis de patrones mensuales en los delitos</p>
    </div>

    <!-- Alert Box -->
    <div class="alert alert--info mb-lg" id="alertIA8Cead">
        <strong>🤖 Interpretación de IA:</strong> <span id="alertText8Cead">Analizando patrones estacionales...</span>
    </div>

    <!-- Legend -->
    <div class="chart-legend mb-md">
        <div class="legend-item">
            <span class="legend-color" style="background: #3b82f6;"></span>
            Año Actual
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #10b981;"></span>
            Año Anterior
        </div>
        <div class="legend-item">
            <span class="legend-color" style="background: #f59e0b; border-style: dashed;"></span>
            Promedio Histórico
        </div>
    </div>

    <!-- Chart -->
    <div class="chart-wrapper chart-wrapper--xl">
        <canvas id="chartEstacionalCead"></canvas>
    </div>
</div>

<style>
    .chart-legend {
        display: flex;
        justify-content: flex-end;
        gap: 1.5rem;
        padding: 0.5rem 0;
    }

    .legend-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.8rem;
        color: var(--color-text-muted);
    }

    .legend-color {
        width: 24px;
        height: 3px;
        border-radius: 2px;
    }
</style>

<script>
    (async function initVista28() {
        const waitForDataCead = () => new Promise(r => {
            const c = () => (typeof STATE_DATA_CEAD !== 'undefined' && STATE_DATA_CEAD.isLoaded) ? r() : setTimeout(c, 100); c();
        });
        await waitForDataCead();

        const COLS = window.COLS_CEAD;
        const data = STATE_DATA_CEAD.allDataHistory;
        if (!data || data.length === 0) return;

        const currentPeriodRow = STATE_DATA_CEAD.allData[0];
        const currentYearNum = currentPeriodRow[COLS.ANIO];

        document.querySelectorAll('.comuna-fill-cead').forEach(el => el.textContent = STATE_DATA_CEAD.comunaName);
        document.querySelectorAll('.periodo-fill-cead').forEach(el => el.textContent = `${currentPeriodRow[COLS.MES]} ${currentPeriodRow[COLS.ANIO]}`);

        await new Promise(r => { if (typeof Chart !== 'undefined') r(); else setTimeout(() => new Promise(x => setTimeout(x, 100)).then(r), 100); });

        const months = ['Ene', 'Feb', 'Mar', 'Abr', 'May', 'Jun', 'Jul', 'Ago', 'Sep', 'Oct', 'Nov', 'Dic'];
        const monthlyData = {};
        months.forEach((m, i) => { monthlyData[i + 1] = { current: 0, previous: 0, all: [], countAll: 0 }; });

        data.forEach(r => {
            const mesNum = r[COLS.MES_NUM]; // 1-12
            const anio = r[COLS.ANIO];
            const casos = r[COLS.CASOS_MES_ACTUAL] || 0;

            if (monthlyData[mesNum]) {
                monthlyData[mesNum].all.push(casos);

                if (anio === currentYearNum) {
                    monthlyData[mesNum].current += casos; // Sum if multiple rows per month
                } else if (anio === currentYearNum - 1) {
                    monthlyData[mesNum].previous += casos;
                }
            }
        });

        // Current Year Data (Sum of cases for that month across all categories)
        // Wait, 'data' contains multiple rows per month (one per crime type). So we must sum them up per month-year.
        // My logic above: monthlyData[mesNum].current += cases. This sums ALL crime types for that month. Correct.

        const currentYear = months.map((_, i) => monthlyData[i + 1].current || null);
        // Note: Future months in current year will be 0. We should probably make them null if they haven't happened.
        // How to know if happened? If sum is 0, is it no crime or no data?
        // Assuming currentPeriodRow[COLS.MES_NUM] is the last valid month.
        const lastValidMonth = currentPeriodRow[COLS.MES_NUM];
        for (let i = lastValidMonth; i < 12; i++) {
            // currentYear[i] = null; // Actually if it's 0 it might look like a drop drop. better null.
            // But my map created 0 if undefined.
            if (i >= lastValidMonth) currentYear[i] = null;
        }
        // Actually wait, currentPeriodRow is Top 1 sorted. So it is the LATEST. 
        // So indices > lastValidMonth-1 should be null. Correct.

        const previousYear = months.map((_, i) => monthlyData[i + 1].previous);

        const historical = months.map((_, i) => {
            const vals = monthlyData[i + 1].all;
            if (vals.length === 0) return 0;
            // Sum all values per unique Year for this month. 
            // Currently vals has all rows (e.g. 5 types * 10 years = 50 vals).
            // We want average TOTAL cases for that month.
            // We need to group vals by year to sum them first.
            // Simplified approach: Sum all and divide by number of unique years in dataset for this month.
            // Let's re-scan quickly for unique years per month.
            const uniqueYears = new Set(data.filter(r => r[COLS.MES_NUM] === (i + 1)).map(r => r[COLS.ANIO])).size;
            const sumAll = vals.reduce((a, b) => a + b, 0);
            return uniqueYears > 0 ? sumAll / uniqueYears : 0;
        });

        document.getElementById('alertText8Cead').innerHTML =
            `El gráfico compara el comportamiento mensual de <strong>${currentYearNum}</strong> vs <strong>${currentYearNum - 1}</strong> y el promedio histórico. ` +
            `Observe si el mes actual supera la línea amarilla (promedio).`;

        new Chart(document.getElementById('chartEstacionalCead'), {
            type: 'line',
            data: {
                labels: months,
                datasets: [
                    {
                        label: `Año ${currentYearNum}`,
                        data: currentYear,
                        borderColor: '#3b82f6',
                        backgroundColor: 'rgba(59, 130, 246, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 4,
                        borderWidth: 2
                    },
                    {
                        label: `Año ${currentYearNum - 1}`,
                        data: previousYear,
                        borderColor: '#10b981',
                        fill: false,
                        tension: 0.3,
                        pointRadius: 4,
                        borderWidth: 2
                    },
                    {
                        label: 'Promedio Hist.',
                        data: historical,
                        borderColor: '#f59e0b',
                        borderDash: [5, 5],
                        fill: false,
                        pointRadius: 0,
                        borderWidth: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: true, position: 'top' } },
                scales: {
                    y: { beginAtZero: false, grid: { color: '#e2e8f0' } },
                    x: { grid: { display: false } }
                }
            }
        });
    })();
</script>
