<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="RID SIMULATOR V2 - Panel de Control Personalizado">

    <title>RID SIMULATOR | Vistas 2</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css?v=3">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="app-layout">
    <!-- Sidebar -->
    <aside id="sidebarContainer" class="sidebar"></aside>

    <!-- Main Content -->
    <main id="mainContent" class="main-content">
        <header class="header">
            <div class="header-actions">
                <button class="btn btn--accent" id="btnExportPdf" style="display: none;">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Exportar PDF</span>
                </button>
                <button class="btn" id="btnExportSingle" onclick="PDFModule.exportSinglePage()">
                    <i class="fa-solid fa-file-export"></i>
                    <span>Generar Hoja</span>
                </button>
                <button class="btn btn--primary" id="btnExportCover" onclick="PDFModule.exportWithCover()"
                    style="display: none;">
                    <i class="fa-solid fa-book"></i>
                    <span>Informe PDF</span>
                </button>
                <button class="btn btn--primary" id="btnComuna">
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="btnComunaText">Cargando...</span>
                </button>
            </div>
        </header>

        <section id="viewContainer" class="view-container" style="position: relative;">
            <div class="loading"></div>
        </section>
    </main>

    <!-- Data Layer -->
    <!-- Unified Data Manager -->
    <!-- We keep data.js strictly for COLS definitions if they are not fully migrated, but DataManager handles loading -->
    <script src="js/data.js?v=4"></script>
    <script src="js/data_cead.js?v=4"></script>
    <script src="js/data_manager.js?v=5"></script>

    <!-- App Scripts -->
    <script src="js/utils/chart-helper.js?v=3"></script>
    <script src="js/utils/chart-enhancer.js?v=3"></script>
    <script src="js/ia.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
    <script src="js/pdf.js?v=3"></script>
    <script src="js/pdf_vistas2.js?v=1"></script>

    <script>
        // Override configuration for Vistas 2
        // We run this immediately to ensure it overrides App before App.init() is called by the DOMContentLoaded event in app.js
        if (window.App) {
            // Definir vistas disponibles según la tabla (01 a 25)
            const vistasEstrategicas = Array.from({ length: 25 }, (_, i) => `vista${i + 1}`);

            App.config.viewsPath = 'vistas2';
            App.config.defaultView = 'vista1';
            App.config.views = vistasEstrategicas;

            // Monkey Patch: Ensure PDF button is always visible for Vistas 2 strategic views
            const originalLoadView = App.loadView;
            App.loadView = async function (viewName) {
                await originalLoadView.call(this, viewName);
                if (this.elements.coverBtn) {
                    this.elements.coverBtn.style.display = 'inline-flex';
                    // Update onclick handler dynamically to be safe
                    this.elements.coverBtn.onclick = function () { window.PDFModuleV2.exportReport(); };
                }
            };

            // Sobrescribir carga de sidebar para usar la v2
            // Sobrescribir carga de sidebar para usar la v2
            App.loadSidebar = async function () {
                try {
                    const response = await fetch('sidebar2.html');
                    const html = await response.text();
                    this.elements.sidebar.innerHTML = html;
                    this.initNavigation();

                    // Actualizar nombre de comuna si ya hay datos
                    if (window.STATE_DATA && window.STATE_DATA.isLoaded) {
                        const comLabel = document.getElementById('sidebarComuna');
                        if (comLabel) comLabel.textContent = window.STATE_DATA.comunaName;
                    }
                } catch (error) {
                    console.error('Error loading sidebar2:', error);
                }
            };

            // Función helper para actualizar UI global
            function updateGlobalUI(comunaName) {
                const btnText = document.getElementById('btnComunaText');
                if (btnText) btnText.textContent = comunaName;

                const sbText = document.getElementById('sidebarComuna');
                if (sbText) sbText.textContent = comunaName;
            }

            // Listener Global para actualizar headers cuando lleguen los datos
            window.addEventListener('dataManagerLoaded', (e) => {
                updateGlobalUI(e.detail.meta.comuna);
            });

            // Comprobar si YA están cargados (por si el evento se disparó antes)
            if (window.DataManager && window.DataManager.state && window.DataManager.state.isLoaded) {
                updateGlobalUI(window.DataManager.state.meta.comuna);
            }

            console.log("🛠️ App Overridden: Mode Vistas2 (Strategic) Active");
        }
    </script>
</body>

</html>
