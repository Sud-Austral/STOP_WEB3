<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Tablero de Indicadores CEAD - Sistema de análisis mensual de estadísticas delictuales">

    <title>Tablero CEAD | Indicadores Mensuales</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css?v=3">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="app-layout">
    <!-- Sidebar -->
    <aside id="sidebarContainer" class="sidebar"></aside>

    <!-- Main Content -->
    <main id="mainContent" class="main-content">
        <header class="header">
            <div class="header-info">
                <h1 id="headerTitle" style="margin: 0; font-size: 1.2rem; color: var(--color-primary);">Análisis
                    Delictual CEAD</h1>
                <p id="headerSubtitle" style="margin: 0; font-size: 0.8rem; color: var(--color-text-muted);">Tablero
                    Mensual de Estadísticas Oficiales</p>
            </div>

            <div class="header-actions">
                <button class="btn btn--accent" id="btnExportPdf" style="display: none;">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Exportar PDF</span>
                </button>
                <button class="btn" id="btnExportSingle" onclick="PDFModule.exportSinglePage()">
                    <i class="fa-solid fa-file-export"></i>
                    <span>Generar Hoja</span>
                </button>
                <button class="btn btn--primary" id="btnExportCover" onclick="PDFModule.exportWithCover()">
                    <i class="fa-solid fa-book"></i>
                    <span>Informe PDF</span>
                </button>
                <button class="btn btn--accent" id="btnExportFull" onclick="PDFModule.exportFullReport()">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Informe PDF Full</span>
                </button>
                <button class="btn" id="btnFilters">
                    <i class="fa-solid fa-filter"></i>
                    <span>Filtros Activos</span>
                </button>
                <button class="btn btn--primary" id="btnComuna">
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="btnComunaTextCead">Cargando...</span>
                </button>
            </div>
        </header>

        <section id="viewContainer" class="view-container" style="position: relative;">
            <div class="loading"></div>
        </section>
    </main>

    <!-- Initialize empty STATE_DATA/COLS that will be populated by CEAD loader -->
    <script>
        // Pre-initialize STATE_DATA so app.js doesn't crash on missing globals
        window.STATE_DATA = {
            codcom: 13101,
            allData: [],
            allDataHistory: [],
            allDataHistory_total: [],
            stats: {},
            comunaName: 'Sin Comuna',
            regionName: 'Sin Región',
            semanaId: null,
            semanaDetalle: '',
            warning: '',
            isLoaded: false
        };
        window.COLS = {};
    </script>

    <!-- CEAD Data Layer -->
    <script src="js/data_cead.js?v=5" type="module"></script>

    <!-- App Scripts -->
    <script src="js/utils/chart-helper.js?v=5"></script>
    <script src="js/utils/chart-enhancer.js?v=5"></script>
    <script src="js/ia.js?v=5"></script>
    <script src="js/app.js?v=5"></script>
    <script src="js/pdf.js?v=5"></script>

    <!-- CEAD Configuration: Remap globals and init app after data loads -->
    <script>
        // Prevent App from auto-initializing with default (STOP) config.
        // Instead, wait for CEAD data then init.
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof App !== 'undefined') {
                // Override defaults for CEAD
                App.config.defaultView = 'vista0';
            }
        });

        // When CEAD data loads, MUTATE globals (not reassign) so polling references work
        window.addEventListener('dataCeadLoaded', () => {
            // MUTATE STATE_DATA (don't reassign — vista0 holds a reference to the original object)
            const src = window.STATE_DATA_CEAD;
            Object.keys(src).forEach(k => { window.STATE_DATA[k] = src[k]; });
            window.STATE_DATA.semanaId = src.periodoId;
            window.STATE_DATA.semanaDetalle = src.periodoDetalle;
            window.STATE_DATA.isLoaded = true;

            // MUTATE COLS (copy all CEAD keys into existing COLS object)
            Object.keys(window.COLS_CEAD).forEach(k => { window.COLS[k] = window.COLS_CEAD[k]; });

            // Update UI Labels to Monthly
            const periodStr = src.periodoDetalle || 'Período Mensual';

            // Sidebar Subtitle
            const sidebarSub = document.getElementById('sidebarComuna');
            if (sidebarSub) sidebarSub.textContent = periodStr;

            // Header Subtitle
            const headerSub = document.getElementById('headerSubtitle');
            if (headerSub) headerSub.textContent = `Informe Mensual: ${periodStr}`;

            // Comuna Button
            const comunaBtn = document.getElementById('btnComunaTextCead');
            if (comunaBtn) comunaBtn.textContent = src.comunaName || 'Santiago';

            // Switch sidebar to CEAD tab
            if (window.switchSidebarTab) {
                setTimeout(() => window.switchSidebarTab('tab-cead'), 200);
            }

            console.log('✅ CEAD globals mutated into STATE_DATA/COLS. isLoaded:', window.STATE_DATA.isLoaded,
                'Total rows:', window.STATE_DATA.allDataHistory_total?.length);
        });
    </script>
</body>

</html>
