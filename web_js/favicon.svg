<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" /> <!-- Emerald 400 -->
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" /> <!-- Emerald 600 -->
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Shield Shape -->
  <path d="M256 32 C180 32, 64 64, 64 64 L 64 224 C 64 360, 256 480, 256 480 C 256 480, 448 360, 448 224 L 448 64 C 448 64, 332 32, 256 32 Z" fill="url(#shieldGrad)" filter="url(#shadow)"/>
  
  <!-- White Background for Icon -->
  <circle cx="256" cy="240" r="110" fill="white" fill-opacity="0.95"/>
  
  <!-- Chart Icon -->
  <g transform="translate(186, 170)">
     <!-- Bar 1 -->
     <rect x="20" y="60" width="20" height="60" rx="4" fill="#10b981"/> <!-- Green -->
     <!-- Bar 2 -->
     <rect x="55" y="30" width="20" height="90" rx="4" fill="#3b82f6"/> <!-- Blue -->
     <!-- Bar 3 -->
     <rect x="90" y="50" width="20" height="70" rx="4" fill="#f59e0b"/> <!-- Amber -->
     <!-- Trend Line -->
     <path d="M20 50 L 55 20 L 90 40 L 120 10" stroke="#ef4444" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
</svg>
