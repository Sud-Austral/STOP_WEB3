<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RID SIMULATOR | Panel de Control</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --sidebar-width: 260px;
            --sidebar-bg: #1a1f2e;
            --sidebar-text: #94a3b8;
            --sidebar-hover: #2d3548;
            --sidebar-active: #3b82f6;
            --content-bg: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-orange: #f59e0b;
        }

        body {
            font-family: 'Outfit', sans-serif;
            display: flex;
            min-height: 100vh;
            background: var(--content-bg);
        }

        /* Sidebar Container */
        #sidebarContainer {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: var(--sidebar-bg);
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            overflow-y: auto;
        }

        /* Main Content Area */
        #mainContent {
            margin-left: var(--sidebar-width);
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header */
        #topHeader {
            background: var(--card-bg);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 50;
        }

        #topHeader h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
        }

        #topHeader .header-actions {
            display: flex;
            gap: 0.75rem;
        }

        #topHeader .btn {
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid #e2e8f0;
            background: white;
            color: var(--text-main);
            transition: all 0.2s;
        }

        #topHeader .btn:hover {
            background: #f8fafc;
        }

        #topHeader .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        #topHeader .btn-primary:hover {
            background: #2563eb;
        }

        #topHeader .btn-export {
            background: var(--accent-orange);
            color: white;
            border-color: var(--accent-orange);
        }

        /* View Container */
        #viewContainer {
            flex: 1;
            padding: 1.5rem;
        }

        /* Loading State */
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 300px;
            color: var(--text-muted);
        }

        .loading::after {
            content: '';
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <!-- Sidebar (loaded dynamically) -->
    <aside id="sidebarContainer"></aside>

    <!-- Main Content -->
    <main id="mainContent">
        <header id="topHeader">
            <div>
                <h1 id="pageTitle">Reporte de Inteligencia Delictual</h1>
                <p id="pageSubtitle" style="font-size: 0.875rem; color: var(--text-muted);"></p>
            </div>
            <div class="header-actions">
                <button class="btn btn-export" id="btnExportPdf">
                    <i class="fa-solid fa-file-pdf"></i> Exportar PDF
                </button>
                <button class="btn" id="btnFilters">Filtros Activos</button>
                <button class="btn btn-primary" id="btnComuna">Santiago</button>
            </div>
        </header>

        <section id="viewContainer">
            <div class="loading"></div>
        </section>
    </main>

    <script type="module">
        // Load Sidebar
        fetch('sidebar.html')
            .then(res => res.text())
            .then(html => {
                document.getElementById('sidebarContainer').innerHTML = html;
                initSidebarNavigation();
            });

        // Load default view
        loadView('vista1');

        function loadView(viewName) {
            const container = document.getElementById('viewContainer');
            container.innerHTML = '<div class="loading"></div>';

            fetch(`vistas/${viewName}.html`)
                .then(res => res.text())
                .then(html => {
                    container.innerHTML = html;
                    // Execute any scripts in the loaded view
                    const scripts = container.querySelectorAll('script');
                    scripts.forEach(script => {
                        const newScript = document.createElement('script');
                        newScript.textContent = script.textContent;
                        document.body.appendChild(newScript);
                    });
                })
                .catch(err => {
                    container.innerHTML = `<div style="padding: 2rem; color: #ef4444;">Error al cargar vista: ${viewName}</div>`;
                });
        }

        function initSidebarNavigation() {
            document.querySelectorAll('[data-view]').forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    const viewName = link.dataset.view;

                    // Update active state
                    document.querySelectorAll('[data-view]').forEach(l => l.classList.remove('active'));
                    link.classList.add('active');

                    // Load the view
                    loadView(viewName);
                });
            });
        }

        // Export PDF - Multiple Views
        document.getElementById('btnExportPdf').addEventListener('click', async () => {
            const { jsPDF } = window.jspdf;
            const container = document.getElementById('viewContainer');
            const pdf = new jsPDF({ unit: 'mm', format: 'a4' });

            const viewsToExport = ['vista1', 'vista2'];

            for (let i = 0; i < viewsToExport.length; i++) {
                const viewName = viewsToExport[i];

                // Load view
                const response = await fetch(`vistas/${viewName}.html`);
                const html = await response.text();
                container.innerHTML = html;

                // Execute scripts in the view
                const scripts = container.querySelectorAll('script');
                for (const script of scripts) {
                    const newScript = document.createElement('script');
                    newScript.textContent = script.textContent;
                    document.body.appendChild(newScript);
                }

                // Wait for charts to render
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Capture
                const canvas = await html2canvas(container, { scale: 2, useCORS: true, backgroundColor: '#f1f5f9' });
                const imgData = canvas.toDataURL('image/jpeg', 0.95);

                const imgWidth = 210;
                const imgHeight = (canvas.height * imgWidth) / canvas.width;

                if (i > 0) pdf.addPage();

                // Handle multi-page content
                let heightLeft = imgHeight;
                let position = 0;
                const pageHeight = 297;

                pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;

                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
                    heightLeft -= pageHeight;
                }
            }

            pdf.save(`Reporte_Completo_${new Date().toISOString().split('T')[0]}.pdf`);

            // Reload original view
            loadView('vista1');
        });

        // Make loadView globally available
        window.loadView = loadView;
    </script>
</body>

</html>
