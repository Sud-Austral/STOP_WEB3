<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Vista 18 - Tasa de Crecimiento y Aceleración Delictual - STOP WEB3">

    <title>Aceleración | STOP WEB3</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles (same as index2) -->
    <link rel="stylesheet" href="css/styles.css?v=5">

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body class="app-layout">
    <!-- Sidebar -->
    <aside id="sidebarContainer" class="sidebar"></aside>

    <!-- Main Content -->
    <main id="mainContent" class="main-content">
        <header class="header">
            <div class="header-actions">
                <button class="btn btn--accent" id="btnExportPdf" style="display: none;">
                    <i class="fa-solid fa-file-pdf"></i>
                    <span>Exportar PDF</span>
                </button>
                <button class="btn" id="btnExportSingle" onclick="PDFModule.exportSinglePage()">
                    <i class="fa-solid fa-file-export"></i>
                    <span>Generar Hoja</span>
                </button>
                <button class="btn btn--primary" id="btnExportCover" onclick="PDFModule.exportWithCover()">
                    <i class="fa-solid fa-book"></i>
                    <span>Informe PDF</span>
                </button>
                <button class="btn btn--accent" id="btnExportFull" onclick="PDFModule.exportFullReport()">
                    <i class="fa-solid fa-book-open"></i>
                    <span>Informe PDF Full</span>
                </button>
                <button class="btn" id="btnFilters">
                    <i class="fa-solid fa-filter"></i>
                    <span>Filtros Activos</span>
                </button>
                <button class="btn btn--primary" id="btnComuna">
                    <i class="fa-solid fa-location-dot"></i>
                    <span id="btnComunaText">Cargando...</span>
                </button>
            </div>
        </header>

        <section id="viewContainer" class="view-container" style="position: relative;">
            <div class="loading"></div>
        </section>
    </main>

    <!-- Data Layer (Must load first) -->
    <script src="js/data.js?v=5" type="module"></script>
    <script src="js/data_cead.js?v=5" type="module"></script>

    <!-- App Scripts -->
    <script src="js/utils/chart-helper.js?v=5"></script>
    <script src="js/utils/chart-enhancer.js?v=5"></script>
    <script src="js/ia.js?v=5"></script>
    <script src="js/app.js?v=5"></script>
    <script src="js/pdf.js?v=5"></script>

    <!-- Override: Force vista18 (Aceleración) -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof App !== 'undefined') {
                App.config.defaultView = 'vista18';
            }
        });
    </script>
</body>

</html>
